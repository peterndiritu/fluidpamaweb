
<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluid - Crypto, Fiat Wallet & Blockchain Hosting</title>
    <meta name="description" content="Fluid is the first Layer-1 blockchain delivering 2M+ TPS with zero-downtime hosting. Store, spend, and host infinitely with our secure non-custodial wallet and Parmaweb protocol." />
    <meta name="keywords" content="Fluid, Crypto, Fiat, Wallet, Blockchain, Hosting, Presale, Layer-1, DEX, AI, Web3, Parmaweb, Non-custodial" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
      
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              slate: {
                850: '#151e32',
                950: '#020617',
              },
              fluid: {
                cyan: '#22d3ee',
                indigo: '#6366f1',
                emerald: '#10b981'
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out',
              'bounce-slow': 'bounce 3s infinite',
              'gradient-x': 'gradientX 6s linear infinite',
              'spin-slow': 'spin 8s linear infinite',
              'glow-line': 'glowLine 3s linear infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              gradientX: {
                '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
              },
              glowLine: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              }
            },
            backgroundImage: {
              'fluid-gradient': 'linear-gradient(to right, #22d3ee, #6366f1, #a855f7, #10b981)',
              'fluid-gradient-vertical': 'linear-gradient(to bottom, #22d3ee, #6366f1, #10b981)',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background-color: #020617;
      }
      
      * { font-family: 'Inter', sans-serif !important; }

      *:not(.docs-section *) { font-style: normal !important; }

      .bg-tech-grid {
        background-size: 50px 50px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      }

      .text-fluid-gradient {
        background: linear-gradient(to right, #22d3ee, #6366f1, #a855f7, #10b981);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradientX 6s linear infinite;
      }

      .scroll-card {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .scroll-card.in-view {
        opacity: 1;
        transform: translateY(0);
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
  </head>
  <body class="bg-slate-950 text-white selection:bg-cyan-500/30">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in-view');
            }
          });
        }, { threshold: 0.1 });

        const observe = () => {
          document.querySelectorAll('.scroll-card').forEach(el => observer.observe(el));
        };

        observe();
        setInterval(observe, 1500);
      });
    </script>
  </body>
</html>
